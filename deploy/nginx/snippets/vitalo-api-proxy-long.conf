# Like vitalo-api-proxy.conf, but waits up to 3 minutes: for the slow AI requests of the admin panel
# («Добавить из iHerb»: the AI writes the card for about a minute; photos are downloaded from iHerb).
# /etc/nginx/snippets/vitalo-api-proxy-long.conf
proxy_pass http://vitalo_api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_read_timeout 180s;
proxy_send_timeout 60s;
