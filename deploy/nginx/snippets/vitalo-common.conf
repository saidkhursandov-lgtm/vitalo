# Included by every VITALO HTTPS site (/etc/nginx/snippets/vitalo-common.conf).
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:vitalo_ssl:10m;
ssl_session_timeout 1d;

# Security headers on every answer (locations use `expires`, not add_header, so these are never dropped)
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# No X-Frame-Options: Telegram Web (web.telegram.org) shows the Mini App inside a frame.

# Product photos are uploaded through the API (originals up to 15 MB are compressed right away)
client_max_body_size 16m;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

server_tokens off;
