# VITALO on one server: shop (Mini App), admin panel and API behind nginx with HTTPS.
#   https://vitalo.uz        -> apps/miniapp/dist  (+ /api and /uploads from the API)
#   https://admin.vitalo.uz  -> apps/admin/dist    (+ /api and /uploads from the API)
#   https://api.vitalo.uz    -> the API itself (127.0.0.1:3000)
# The shop and the admin panel call /api on their own domain, so no CORS is involved.
# Installed as /etc/nginx/sites-available/vitalo.conf (see DEPLOY.md, section 9).
# Caching is set with `expires` (not add_header) so the security headers of the snippet stay on every answer.

upstream vitalo_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

# HTTP -> HTTPS (and Let's Encrypt renewals)
server {
    listen 80;
    listen [::]:80;
    server_name vitalo.uz admin.vitalo.uz api.vitalo.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------ shop: vitalo.uz
server {
    # nginx 1.24 (Ubuntu 24.04) does not know the newer `http2 on;` directive
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vitalo.uz;

    ssl_certificate     /etc/letsencrypt/live/vitalo.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vitalo.uz/privkey.pem;
    include /etc/nginx/snippets/vitalo-common.conf;
    # Аудит 10.11, п. 1.13: встраивать Mini App можно только самому сайту и Telegram Web. Пока только наблюдение
    # (Report-Only); после проверки в Telegram Web, Desktop и на телефоне — заменить на Content-Security-Policy.
    add_header Content-Security-Policy-Report-Only "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;

    root /opt/vitalo/app/apps/miniapp/dist;

    location /api/ {
        include /etc/nginx/snippets/vitalo-api-proxy.conf;
    }
    # The bot talks to the API on 127.0.0.1 directly; this part is never public.
    location /api/internal/ {
        return 404;
    }
    location /uploads/ {
        alias /var/lib/vitalo/uploads/;
        expires 30d;
    }
    # Hashed JS/CSS/fonts from the build never change under the same name
    location /assets/ {
        expires 1y;
    }
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}

# ------------------------------------------------------------------ admin panel: admin.vitalo.uz
server {
    # nginx 1.24 (Ubuntu 24.04) does not know the newer `http2 on;` directive
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.vitalo.uz;

    ssl_certificate     /etc/letsencrypt/live/vitalo.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vitalo.uz/privkey.pem;
    include /etc/nginx/snippets/vitalo-common.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # Аудит 10.11, п. 1.13. Камера, микрофон и геолокация админке не нужны (решение владельца 11.11).
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP — сначала только наблюдение (Report-Only): браузер пишет нарушения в консоль, но ничего не блокирует.
    # После дня проверки (вход через Telegram, фото, печать, открытие из бота) заменить на Content-Security-Policy.
    # telegram.org — скрипты входа и Web App; oauth.telegram.org — окно входа виджета (frame);
    # web.telegram.org — админку можно открыть из бота в Telegram Web (там она внутри frame).
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://telegram.org; frame-src https://oauth.telegram.org; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://web.telegram.org" always;

    root /opt/vitalo/app/apps/admin/dist;

    location /api/ {
        include /etc/nginx/snippets/vitalo-api-proxy.conf;
    }
    location /api/internal/ {
        return 404;
    }
    location /uploads/ {
        alias /var/lib/vitalo/uploads/;
        expires 30d;
    }
    location /assets/ {
        expires 1y;
    }
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}

# ------------------------------------------------------------------ API: api.vitalo.uz
server {
    # nginx 1.24 (Ubuntu 24.04) does not know the newer `http2 on;` directive
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.vitalo.uz;

    ssl_certificate     /etc/letsencrypt/live/vitalo.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vitalo.uz/privkey.pem;
    include /etc/nginx/snippets/vitalo-common.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/internal/ {
        return 404;
    }
    location /uploads/ {
        alias /var/lib/vitalo/uploads/;
        expires 30d;
    }
    location / {
        include /etc/nginx/snippets/vitalo-api-proxy.conf;
    }
}
