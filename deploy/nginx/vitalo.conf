# VITALO on one server: shop (Mini App), admin panel and API behind nginx with HTTPS.
#   https://vitalo.uz        -> apps/miniapp/dist  (+ /api and /uploads from the API)
#   https://admin.vitalo.uz  -> apps/admin/dist    (+ /api and /uploads from the API)
#   https://api.vitalo.uz    -> the API itself (127.0.0.1:3000)
# The shop and the admin panel call /api on their own domain, so no CORS is involved.
# Installed as /etc/nginx/sites-available/vitalo.conf (see DEPLOY.md, section 9).
# Caching is set with `expires` (not add_header) so the security headers of the snippet stay on every answer.

upstream vitalo_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

# HTTP -> HTTPS (and Let's Encrypt renewals)
server {
    listen 80;
    listen [::]:80;
    server_name vitalo.uz admin.vitalo.uz api.vitalo.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------ shop: vitalo.uz
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vitalo.uz;

    ssl_certificate     /etc/letsencrypt/live/vitalo.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vitalo.uz/privkey.pem;
    include /etc/nginx/snippets/vitalo-common.conf;

    root /opt/vitalo/app/apps/miniapp/dist;

    location /api/ {
        include /etc/nginx/snippets/vitalo-api-proxy.conf;
    }
    # The bot talks to the API on 127.0.0.1 directly; this part is never public.
    location /api/internal/ {
        return 404;
    }
    location /uploads/ {
        alias /var/lib/vitalo/uploads/;
        expires 30d;
    }
    # Hashed JS/CSS/fonts from the build never change under the same name
    location /assets/ {
        expires 1y;
    }
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}

# ------------------------------------------------------------------ admin panel: admin.vitalo.uz
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.vitalo.uz;

    ssl_certificate     /etc/letsencrypt/live/vitalo.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vitalo.uz/privkey.pem;
    include /etc/nginx/snippets/vitalo-common.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;

    root /opt/vitalo/app/apps/admin/dist;

    location /api/ {
        include /etc/nginx/snippets/vitalo-api-proxy.conf;
    }
    location /api/internal/ {
        return 404;
    }
    location /uploads/ {
        alias /var/lib/vitalo/uploads/;
        expires 30d;
    }
    location /assets/ {
        expires 1y;
    }
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}

# ------------------------------------------------------------------ API: api.vitalo.uz
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.vitalo.uz;

    ssl_certificate     /etc/letsencrypt/live/vitalo.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vitalo.uz/privkey.pem;
    include /etc/nginx/snippets/vitalo-common.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/internal/ {
        return 404;
    }
    location /uploads/ {
        alias /var/lib/vitalo/uploads/;
        expires 30d;
    }
    location / {
        include /etc/nginx/snippets/vitalo-api-proxy.conf;
    }
}
