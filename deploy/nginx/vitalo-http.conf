# Step 1 only (before the HTTPS certificate exists): answers Let's Encrypt checks on port 80.
# After `certbot certonly` succeeds, this file is replaced by vitalo.conf (see DEPLOY.md, section 9).
server {
    listen 80;
    listen [::]:80;
    server_name vitalo.uz admin.vitalo.uz api.vitalo.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "VITALO: the server is being set up\n";
        add_header Content-Type text/plain;
    }
}
