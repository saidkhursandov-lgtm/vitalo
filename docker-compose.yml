services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vitalo
      POSTGRES_PASSWORD: vitalo
      # Created only on the first start of an empty volume. Local working DB: vitalo_dev (an older volume may still
      # have "vitalo": rename it with scripts/rename-local-db.ps1). Tests create vitalo_test themselves.
      POSTGRES_DB: vitalo_dev
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vitalo
      MINIO_ROOT_PASSWORD: vitalo-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
volumes:
  pgdata:
  miniodata:
